[project]
name = "evemarket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
]

[project.scripts]
evemarket = "evemarket.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evemarket"]
